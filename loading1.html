    <!-- 4. CURRENT HERO SECTION (The End Screen) -->
    <section class="hero-scroll-track hero-loading-primed" id="hero">
        <div class="hero-sticky">
            <div class="hero-3d-gallery-container">
                <div class="hero-3d-gallery-scene" id="hero-3d-scene"></div>
                <script>
                // Hero 3D Gallery blur-reveal controller
                (function initHeroBlurReveal() {
                    const scene = document.getElementById('hero-3d-scene');
                    if (!scene) return;

                    let revealRafId = null;
                    function triggerBlurReveal() {
                        if (revealRafId) cancelAnimationFrame(revealRafId);
                        revealRafId = requestAnimationFrame(() => {
                            scene.style.transition = 'opacity 1.6s cubic-bezier(0.16, 1, 0.3, 1), filter 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1)';
                            revealRafId = requestAnimationFrame(() => {
                                scene.classList.add('hero-revealed');
                                revealRafId = null;
                            });
                        });
                    }

                    function resetBlurState() {
                        if (revealRafId) {
                            cancelAnimationFrame(revealRafId);
                            revealRafId = null;
                        }
                        scene.style.transition = 'none';
                        scene.classList.remove('hero-revealed');
                        void scene.offsetHeight;
                    }

                    window.heroBlurController = {
                        trigger: triggerBlurReveal,
                        reset: resetBlurState
                    };
                })();
                </script>
            </div>

            <div class="hero-main-content">
                <h1 class="hero-title" aria-label="Divyaraj Chauhan">
                    <span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Divyaraj Chauhan — </span>Divyaraj.
                </h1>
                <p class="hero-subtitle-mono">A digital strategist building brands, platforms, and cinematic stories.</p>
            </div>

            <div class="hero-content-overlay">

                        <span class="meta-mobile-text">Open to Work</span>
                    </span>

                <div class="hero-bottom-meta">

    <!-- 5. FLOATING TEST CONTROLS (Easily replay animation on /loading1) -->
    <div class="loading-test-dock">
        <button type="button" class="replay-animation-btn" id="replayBtn" aria-label="Replay loading animation">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
            <span>Replay Animation</span>
        </button>
        <span class="replay-shortcut-hint">Space / R</span>
    </div>

    <!-- Scripts -->
    <script src="/js/navigation.js"></script>
    <script type="module" src="/js/hero-gallery.js?v=9"></script>
    <script src="/js/loading-transition.js?v=20261108g"></script>

    <!-- Keyboard shortcut for replay -->
    <script>
    (function() {
        const replayBtn = document.getElementById('replayBtn');
        if (replayBtn) {
            replayBtn.addEventListener('click', () => {
                if (window.siteLoader) window.siteLoader.replay();
            });
        }
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                if (window.siteLoader) window.siteLoader.replay();
            }
        });
    })();
    </script>
